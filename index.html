<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DearDiary | A Calm & Private Digital Journal</title>
  <meta name="description"
    content="A simple, polished digital diary application for recording daily experiences, thoughts, goals, and emotions in a serene, private environment.">

  <!-- Favicon -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪶</text></svg>">

  <!-- Style Sheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/garden.css">

  <!-- React 18 & ReactDOM UMD CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <!-- Application Modules -->
  <script src="js/mockData.js"></script>
  <script src="js/services/authService.js"></script>
  <script src="js/services/storageService.js"></script>

  <!-- Components (JSX) -->
  <script type="text/babel" src="js/components/PasswordInput.js"></script>
  <script type="text/babel" src="js/components/MoodBadge.js"></script>
  <script type="text/babel" src="js/components/TagInput.js"></script>
  <script type="text/babel" src="js/components/ConfirmModal.js"></script>
  <script type="text/babel" src="js/components/ToastNotification.js"></script>
  <script type="text/babel" src="js/components/ImageLightbox.js"></script>
  <script type="text/babel" src="js/components/ReminderBadge.js"></script>
  <script type="text/babel" src="js/components/ReminderPicker.js"></script>
  <script type="text/babel" src="js/components/ImageAttachment.js"></script>
  <script type="text/babel" src="js/components/Navbar.js"></script>

  <!-- Screens (JSX) -->
  <script type="text/babel" src="js/screens/AuthScreen.js"></script>
  <script type="text/babel" src="js/screens/HomeScreen.js"></script>
  <script type="text/babel" src="js/screens/WriteScreen.js"></script>
  <script type="text/babel" src="js/screens/HistoryScreen.js"></script>
  <script type="text/babel" src="js/screens/ProfileScreen.js"></script>
  <script type="text/babel" src="js/screens/MemoryGardenScreen.js"></script>

  <!-- Main Application Controller -->
  <script type="text/babel" src="js/app.js"></script>
</body>

</html>
